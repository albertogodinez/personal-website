version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # oxlint releases weekly; monthly keeps the PR volume sane.
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for both linters — they are upgraded and re-baselined together.
      linters:
        patterns:
          - oxlint
          - '@biomejs/biome'
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
