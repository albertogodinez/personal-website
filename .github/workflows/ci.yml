name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` on purpose — the action reads package.json's
      # `packageManager` field, so this cannot drift from the repo's pin.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxlint on .ts/.tsx, Biome on .css. Both must pass.
      - name: Lint
        run: pnpm lint

      # Advisory only: Biome's Astro support is experimental, so it must never
      # gate CI. Remove `continue-on-error` when it reaches stable support.
      - name: Lint .astro (advisory)
        run: pnpm lint:astro
        continue-on-error: true

      # Full build (astro check + astro build). /moodboard renders from the
      # committed src/content/moodboard/raindrop-collection.json, so no
      # RAINDROP_* secrets are needed. Netlify still builds and deploys main.
      - name: Build
        run: pnpm build

      - name: Install Chromium for verify-site
        run: pnpm exec playwright install --with-deps chromium

      # Same command as .husky/pre-push: dev vs production build, pixel-diffed.
      - name: Visual parity
        run: pnpm verify:site parity --no-build

      - name: Upload parity screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-site
          path: .verify/
          # .verify is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
